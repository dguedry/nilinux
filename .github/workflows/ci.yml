name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Flathub linter (manifest, metainfo)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flatpak-builder-lint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint manifest
        # --exceptions + our appid-keyed file waive only finish-args-host-tmp-access
        # (the shared /tmp wineserver socket; see flatpak/lint-exceptions.json and the
        # manifest comment). Every other finding still fails the job. This waiver must
        # also be requested when submitting to Flathub.
        run: >-
          flatpak-builder-lint --exceptions
          --user-exceptions flatpak/lint-exceptions.json
          manifest flatpak/io.github.dguedry.nilinux.yml
      - name: Lint metainfo
        run: flatpak-builder-lint appstream data/io.github.dguedry.nilinux.metainfo.xml

  python:
    name: Python syntax and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install olefile
      - run: python -m compileall -q nilinux
      - name: Import every non-GUI module
        run: python -c "import nilinux, nilinux.cli, nilinux.doctor, nilinux.products, nilinux.native_access, nilinux.yabridge, nilinux.wine, nilinux.msi, nilinux.download, nilinux.progress, nilinux.paths"
      - run: python -m nilinux --help

  flatpak:
    name: Flatpak build (working tree)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate working-tree manifest
        run: python3 flatpak/dev-manifest.py
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: flatpak/io.github.dguedry.nilinux.dev.yml
          bundle: nilinux.flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.dguedry.nilinux.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: nilinux-flatpak
          path: nilinux.flatpak
          if-no-files-found: error

  release:
    name: Publish bundle to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, python, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nilinux-flatpak
      - name: Create or update the release and attach the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "nilinux $TAG" --generate-notes
          gh release upload "$TAG" nilinux.flatpak --repo "$GITHUB_REPOSITORY" --clobber
